name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting (changed files only)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.dart' \
            | grep -v -E '\.(g|freezed)\.dart$' || true)
          if [ -z "$files" ]; then
            echo "No changed Dart files to check."
            exit 0
          fi
          echo "Checking:"
          echo "$files"
          echo "$files" | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
