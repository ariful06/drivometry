name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [dev, main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so skipped runs (comments without @claude, the bot's own
    # verdict comment) never cancel a review; only a new push replaces one.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'pull_request' && 'review' || 'reply' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$TOKEN$KEY" ]; then
            echo "::warning::Claude review skipped: add the CLAUDE_CODE_OAUTH_TOKEN repository secret (run 'claude setup-token' locally) or ANTHROPIC_API_KEY."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: Review pull request
        if: steps.creds.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5-5 --allowedTools mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
          prompt: |
            You are reviewing a pull request in an offline-first Flutter vehicle fuel and maintenance app (Clean Architecture: data/domain/presentation per feature, Cubits, get_it, Hive, go_router).

            Review PR ${{ github.repository }}#${{ github.event.pull_request.number }}.

            Read docs/IMPLEMENTATION_PLAN.md and the linked VRF issue to judge the acceptance criteria.

            Focus on: correctness bugs, data loss and migration safety for Hive, notification scheduling, calculation correctness, missing tests, and security. Skip pure style nits.

            Post inline comments only for real problems. Then post exactly ONE top-level PR comment via `gh pr comment` titled "## Claude review — verdict" whose first line after the title is `@${{ github.repository_owner }}` (so the owner gets a GitHub Mobile notification), containing: Summary, Findings (severity-ranked, or "none"), Acceptance criteria check, and a final line that is exactly `Verdict: ✅ Ready for owner approval` or `Verdict: ❌ Changes requested`.

            You must NOT approve, request changes via the review API, merge, push, or modify files. The repository owner makes the final decision.

      - name: Answer @claude comment
        if: steps.creds.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5-5 --allowedTools mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
